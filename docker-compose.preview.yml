# Per-PR preview environment for Coolify.
#
# A SINGLE container: the built web client + Express/Socket.io server, plus an
# embedded throwaway Postgres started at boot (scripts/preview-db-init.sh). We
# embed the DB rather than use a sidecar service because Coolify renames
# containers per preview, which breaks cross-container DNS — so the app talks to
# 127.0.0.1 and there is no inter-container networking to fail.
#
# Coolify assigns the public domain to this service (port 8000). See PREVIEW.md
# for the one-time setup. The DB creds here are NOT secrets: the database is
# in-container and disposable.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DB_HOST=127.0.0.1
      - DB_PORT=5432
      - DB_USER=ouigame
      - DB_PASSWORD=ouigame
      - DB_NAME=ouigame
      # Google sign-in is disabled in previews (OAuth origins are dynamic per
      # PR). The server only warns when this is empty — everything else works.
      - GOOGLE_CLIENT_ID=
      # Production snapshot to restore at boot (full copy — see PREVIEW.md).
      # Set these on the Coolify resource. Leave PREVIEW_DUMP_S3_ENDPOINT empty
      # to skip seeding and start with an empty database.
      - PREVIEW_DUMP_S3_ENDPOINT=
      - PREVIEW_DUMP_S3_BUCKET=
      - PREVIEW_DUMP_S3_ACCESS_KEY=
      - PREVIEW_DUMP_S3_SECRET_KEY=
      - PREVIEW_DUMP_OBJECT=preview-seed/latest.sql.gz
      # Coolify magic var: generates a domain for this service on port 8000 and
      # wires up its reverse proxy. Leave the value empty — Coolify fills it.
      - SERVICE_FQDN_APP_8000
    expose:
      - "8000"
    # Publish the app on a fixed host port so it can be reached directly at
    # http://<server-ip>:8083, bypassing Coolify's reverse proxy entirely (its
    # per-preview domain routing wasn't working on this instance). Temporary —
    # only one preview can use this host port at a time.
    ports:
      - "8083:8000"
    restart: unless-stopped
