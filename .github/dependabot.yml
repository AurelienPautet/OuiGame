# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # This repo is a pnpm workspace (see pnpm-workspace.yaml) with a single
  # lockfile at the root. Dependabot must run from the root for the npm
  # ecosystem: only then does it resolve the workspace packages and regenerate
  # pnpm-lock.yaml. Per-workspace entries ("/apps/web/", "/apps/api/") are
  # treated as standalone npm projects, so they bump that package.json without
  # touching the root lockfile, and every CI job fails on
  # `pnpm install --frozen-lockfile` with ERR_PNPM_OUTDATED_LOCKFILE.
  - package-ecosystem: "npm"
    # Covers the root manifest and every package in pnpm-workspace.yaml.
    directory: "/"
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: "daily"
