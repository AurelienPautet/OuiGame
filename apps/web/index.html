<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/x-icon"
      sizes="16x16 32x32 48x48 64x64"
      href="%BASE_URL%icon.ico"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="%BASE_URL%favicon.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OUI TANK</title>
    <meta
      name="description"
      content="Roll out, blast bots and friends. Build your own levels, climb the leaderboard, win the field."
    />

    <!-- Open Graph / Facebook / Reddit -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wiitank.pautet.net/" />
    <meta property="og:title" content="OUI TANK" />
    <meta
      property="og:description"
      content="Roll out, blast bots and friends. Build your own levels, climb the leaderboard, win the field."
    />
    <meta
      property="og:image"
      content="https://wiitank.pautet.net/og-image.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://wiitank.pautet.net/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1402" />
    <meta property="og:image:height" content="1122" />
    <meta property="og:image:alt" content="OUI TANK game cover art" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://wiitank.pautet.net/" />
    <meta name="twitter:title" content="OUI TANK" />
    <meta
      name="twitter:description"
      content="Roll out, blast bots and friends. Build your own levels, climb the leaderboard, win the field."
    />
    <meta
      name="twitter:image"
      content="https://wiitank.pautet.net/og-image.png"
    />
    <meta name="twitter:image:alt" content="OUI TANK game cover art" />

    <!-- Google Sign-In API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- React app — the game runtime is bundled in via the
         @ouigame/shared/game import (was: 14 shared/*.js <script> tags). -->
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
